# Builds the Happy Parenthood Android app (android/) on GitHub's computers.
# - With the signing secrets set: a signed app file. On main it is published at
#   https://github.com/ilakkiyagpi-sketch/parenthoodofilakkiya/releases/latest/download/happy-parenthood.apk
# - Without them: a test build (attached to the run) just to check that everything compiles.
name: Android app

on:
  push:
    branches: [main, 'claude/**']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Signing key
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets yet: making a test build only."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the app
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          if [ "${{ steps.key.outputs.signed }}" = "true" ]; then
            gradle assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk ../happy-parenthood.apk
          else
            gradle assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk ../happy-parenthood-test.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: happy-parenthood-apk
          path: '*.apk'

      - name: Publish the app file for download
        if: github.ref == 'refs/heads/main' && steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest happy-parenthood.apk \
            --title "Happy Parenthood Android app" \
            --notes "Latest app for the family's phones (build ${{ github.run_number }}). Download happy-parenthood.apk on the phone and tap it to install or update." \
            --latest
