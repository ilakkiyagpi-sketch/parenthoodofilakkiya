<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Parenthood Arena</title>
  <meta name="description" content="Personal child tracker and parenting guide that adapts from baby to teen.">
  <meta name="theme-color" content="#2a78d6">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="hdr" class="hdr"></header>
  <main id="main" class="main"><p class="empty">Loading…</p></main>
  <button class="fab" data-act="openPicker" aria-label="Add a log entry">＋</button>
  <nav class="tabs" aria-label="Sections">
    <button data-act="view" data-view="today"><span>🏠</span>Today</button>
    <button data-act="view" data-view="diary"><span>📒</span>Diary</button>
    <button data-act="view" data-view="routine"><span>🕒</span>Routine</button>
    <button data-act="view" data-view="heart"><span>💛</span>Heart</button>
    <button data-act="view" data-view="grow"><span>🌱</span>Grow</button>
    <button data-act="view" data-view="guide"><span>📖</span>Guide</button>
  </nav>
  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
